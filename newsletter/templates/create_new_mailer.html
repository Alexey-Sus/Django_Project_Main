{% extends 'base_template_news.html' %}
{% block content %}

<div class="container">
  <div class="row">
      <p class="fw-light">Создание новой рассылки</p>
    <div class="col">
      <form class="row" method="post" enctype="multipart/form-data">
        <div class="card">
             <div class="card-body">
                {% csrf_token %}
                {{ form.as_p}}
             </div>
            <button type="submit" class="btn btn-primary">
              Создать
            </button>
            <a class="btn btn-warning" href="{% url 'newsletter:process_mailers' %}" role="button">Назад к списку рассылок</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
