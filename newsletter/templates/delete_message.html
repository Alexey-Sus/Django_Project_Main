{% extends 'base_template_news.html' %}
{% block content %}

<div class="container">
  <div class="row">
    <div class="col">
      <form class="row" method="post" enctype="multipart/form-data">
        <div class="card">
             <div class="card-body">
                {% csrf_token %}
                {{ form.as_p }}
             </div>
            <div class="col">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="card-title">{{ message.subject }}</h1>
                <p class="card-text">{{ message.message_body | truncatechars:40 }}</p>

                <div class="d-flex justify-content-between align-items-center">
                </div>
            </div>
        </div>
    </div>
            <h3>Удалить сообщение?</h3>
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a class="btn btn-secondary" href="{% url 'catalog:main' %}" role="button">Отмена</a>

        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
