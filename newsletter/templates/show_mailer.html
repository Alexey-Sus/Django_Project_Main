{% extends 'base_template_news.html' %}

{% block content %}
<div class="col">
    <div class="card shadow-sm">
        <div class="card-body">
            <p>Рассылка</p>
            <p class="card-text">{{ mailer.message }}</p>
            <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                    <a class="btn btn-secondary" href="{% url 'newsletter:update_mailer' mailer.pk %}" role="button">Редактировать</a>
                    <a class="btn btn-primary" href="{% url 'newsletter:process_mailers' %}" role="button">К списку рассылок</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
