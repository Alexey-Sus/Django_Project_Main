{% extends 'base_template_news.html' %}

{% block content %}
<div class="col">
    <div class="card shadow-sm">
        <div class="card-body">
            <p>Сообщение</p>
            <h2>{{ message.subject }}</h2>
            <p class="card-text">{{ message.message_body }}</p>
            <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                    <a class="btn btn-secondary" href="{% url 'newsletter:update_message' message.pk %}" role="button">Редактировать</a>
                    <a class="btn btn-primary" href="{% url 'newsletter:process_messages' %}" role="button">К списку сообщений</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
