{% extends 'base_template_news.html' %}

{% block content %}
<div class="col">
    <div class="card shadow-sm">
        <div class="card-body">
            <p>Подписчик</p>
            <h2>{{ recipient.email }}</h2>
            <p class="card-text">{{ recipient.full_name }}</p>
            <p class="card-text">{{ recipient.comment }}</p>
            <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                    <a class="btn btn-secondary" href="{% url 'newsletter:update_recipient' recipient.pk %}" role="button">Редактировать</a>
                    <a class="btn btn-primary" href="{% url 'newsletter:process_recipients' %}" role="button">К списку подписчиков</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
