{% extends 'base_template_news.html' %}

{% block content %}
<div class="col">
    <div class="card shadow-sm">
        <div class="card-body">
            <p>Пользователь сервиса</p>
            <h2>{{ user.email }}</h2>
            <p class="card-text">{{ user.email }}</p>

            {% if user.phone_number %}
            <p class="card-text">{{ user.phone_number }}</p>
            {% else %}
            <p class="card-text">Номер телефона не указан</p>
            {% endif %}

            <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                    <a class="btn btn-secondary" href="{% url 'newsletter:update_user' user.pk %}" role="button">Редактировать</a>
                    <a class="btn btn-primary" href="{% url 'newsletter:process_users' %}" role="button">К списку пользователей</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
